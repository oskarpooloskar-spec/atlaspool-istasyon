<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlaspool Pompa Test İstasyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Üst Bilgi -->
        <header class="mb-6 flex flex-col md:flex-row justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h1 class="text-xl md:text-2xl font-bold text-cyan-400">Atlaspool Pompa Test İstasyonu</h1>
            <div id="status" class="text-sm font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-300 mt-2 md:mt-0 border border-slate-700">Sistem Hazır</div>
        </header>

        <!-- Ana İçerik: İki Sütunlu Yapı -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- SOL TARAF: Operatör Veri Giriş Formu -->
            <div class="lg:col-span-5 bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
                <form id="testForm" class="space-y-4">
                    
                    <!-- P NO (Seri No) + Kameradan Tara -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">P NO (Seri No)</label>
                        <div class="flex gap-2">
                            <input type="text" id="pno" required placeholder="86000000082673" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-semibold focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <button type="button" onclick="kamerayiAc()" class="bg-slate-800 hover:bg-slate-700 border border-cyan-500/40 text-cyan-300 text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition cursor-pointer">
                                📷 Kameradan Tara
                            </button>
                        </div>
                        <div id="reader" class="mt-3 hidden rounded-lg overflow-hidden border border-slate-700"></div>
                    </div>

                    <!-- Operatör Adı -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Operatör Adı</label>
                        <input type="text" id="operator" required placeholder="Örn: Mehmet Ali" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    </div>

                    <!-- Pompa / Motor Modeli -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Pompa / Motor Modeli</label>
                        <select id="model" required onchange="gucGuncelle()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <option value="FLORİDA">FLORİDA</option>
                            <option value="BEST">BEST</option>
                            <option value="STORM">STORM</option>
                            <option value="BÜYÜK MOTOR">BÜYÜK MOTOR</option>
                        </select>
                    </div>

                    <!-- Motor Gücü (HP) - Kesin Görünür Alan -->
                    <div>
                        <label class="block text-sm font-medium text-cyan-400 mb-1">Motor Gücü (HP)</label>
                        <select id="guc" required class="w-full bg-slate-950 border border-cyan-500 rounded-lg p-2.5 text-white font-bold focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <!-- JavaScript ile dolacak -->
                        </select>
                    </div>

                    <!-- Elektrik Tipi (Voltaj) -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Elektrik Tipi (Voltaj)</label>
                        <select id="voltaj" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <option value="Monofaze (220V)">Monofaze (220V)</option>
                            <option value="Trifaze (380V)">Trifaze (380V)</option>
                        </select>
                    </div>

                    <!-- Montaj Durumu & Ek Durumlar -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Montaj Durumu</label>
                            <select id="montaj" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                                <option value="Tamamlandı">Tamamlandı</option>
                                <option value="Beklemede">Beklemede</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Ek durumlar</label>
                            <div class="flex gap-2">
                                <label class="flex-1 flex items-center gap-2 bg-slate-950 border border-slate-700 rounded-lg p-2.5 cursor-pointer text-xs font-medium">
                                    <input type="checkbox" id="testKapama" class="accent-cyan-500 w-4 h-4"> Test Kapama
                                </label>
                                <label class="flex-1 flex items-center gap-2 bg-slate-950 border border-slate-700 rounded-lg p-2.5 cursor-pointer text-xs font-medium">
                                    <input type="checkbox" id="rekor" class="accent-cyan-500 w-4 h-4"> Rekor
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Onay / Ret Butonları -->
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button type="button" onclick="veriyiGonder('ONAY')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg cursor-pointer">
                            TEST ONAYLANDI
                        </button>
                        <button type="button" onclick="veriyiGonder('RET')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg cursor-pointer">
                            TEST RET / HATALI
                        </button>
                    </div>
                </form>
            </div>

            <!-- SAĞ TARAF: Canlı Üretim Özeti & Grafik Paneli -->
            <div class="lg:col-span-7 bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <h2 class="text-lg font-semibold text-cyan-400">Bugünkü Üretim Özeti</h2>
                        <button onclick="verileriCek()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-md text-slate-300 transition cursor-pointer">Yenile</button>
                    </div>
                    
                    <!-- Sayaç Kartları -->
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 text-center">
                            <div class="text-xs text-slate-400 font-medium">Toplam Test</div>
                            <div id="toplamSayac" class="text-2xl font-bold text-white mt-1">0</div>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 text-center">
                            <div class="text-xs text-emerald-400 font-medium">Onaylanan</div>
                            <div id="onaySayac" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 text-center">
                            <div class="text-xs text-rose-400 font-medium">Ret / Hatalı</div>
                            <div id="retSayac" class="text-2xl font-bold text-rose-400 mt-1">0</div>
                        </div>
                    </div>
                </div>

                <!-- Grafik Alanı -->
                <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 relative h-72">
                    <canvas id="uretimGrafik"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYwiqTCEsgAfp6vLeCStVvlxY9qKzCW1lx-Ciavb2lte_LSoDYgIrFqdHu7GbnxrvXFg/exec";
        let uretimChart = null;
        let html5QrCode = null;

        const motorGucListesi = {
            "FLORİDA": ["0.50 HP", "0.75 HP", "1 HP", "1.50 HP"],
            "BEST": ["0.75 HP", "1 HP", "1.50 HP", "2.0 HP", "3.0 HP"],
            "STORM": ["3.5 HP", "4.5 HP", "5.5 HP"],
            "BÜYÜK MOTOR": ["7.5 HP", "10 HP", "12.5 HP", "15 HP"]
        };

        function gucGuncelle() {
            const modelSecimi = document.getElementById('model').value;
            const gucSelect = document.getElementById('guc');
            
            gucSelect.innerHTML = '';
            
            if (motorGucListesi[modelSecimi]) {
                motorGucListesi[modelSecimi].forEach(gucDegeri => {
                    let opt = document.createElement('option');
                    opt.value = gucDegeri;
                    opt.textContent = gucDegeri;
                    gucSelect.appendChild(opt);
                });
            }
        }

        window.onload = function() {
            gucGuncelle();
            verileriCek();
            setInterval(verileriCek, 30000);
        };

        function kamerayiAc() {
            const readerDiv = document.getElementById('reader');
            readerDiv.classList.toggle('hidden');
            if (!readerDiv.classList.contains('hidden')) {
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 100 } },
                    (decodedText) => {
                        document.getElementById('pno').value = decodedText;
                        html5QrCode.stop();
                        readerDiv.classList.add('hidden');
                    },
                    (errorMessage) => {}
                ).catch(err => { alert("Kamera başlatılamadı: " + err); readerDiv.classList.add('hidden'); });
            } else {
                if (html5QrCode) html5QrCode.stop().catch(e => {});
            }
        }

        function grafikOlustur(labels, data) {
            const ctx = document.getElementById('uretimGrafik').getContext('2d');
            if (uretimChart) uretimChart.destroy();
            uretimChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Model Bazlı Üretim Adedi',
                        data: data,
                        backgroundColor: '#06b6d4',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        async function verileriCek() {
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                if (result.status === "success") {
                    document.getElementById('toplamSayac').innerText = result.toplam || 0;
                    document.getElementById('onaySayac').innerText = result.onay || 0;
                    document.getElementById('retSayac').innerText = result.ret || 0;
                    const labels = Object.keys(result.modeller || {});
                    const data = Object.values(result.modeller || {});
                    grafikOlustur(labels.length ? labels : ['Veri Yok'], data.length ? data : [0]);
                }
            } catch (error) {
                console.error("Veri çekme hatası:", error);
            }
        }

        async function veriyiGonder(durumSonucu) {
            const pno = document.getElementById('pno').value.trim();
            const operator = document.getElementById('operator').value.trim();
            const model = document.getElementById('model').value;
            const guc = document.getElementById('guc').value;
            const voltaj = document.getElementById('voltaj').value;

            if (!pno || !operator) {
                alert("Lütfen Operatör Adı ve P NO alanlarını doldurun!");
                return;
            }

            const status = document.getElementById('status');
            status.innerText = "Gönderiliyor...";
            status.className = "text-sm font-medium px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 mt-2 md:mt-0";

            const formData = {
                pno: pno,
                operator: operator,
                model: model,
                guc: guc,
                voltaj: voltaj,
                montaj: document.getElementById('montaj').value,
                testKapama: document.getElementById('testKapama').checked ? "Evet" : "Hayır",
                rekor: document.getElementById('rekor').checked ? "Evet" : "Hayır",
                durum: durumSonucu
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                status.innerText = "Başarıyla Kaydedildi!";
                status.className = "text-sm font-medium px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 mt-2 md:mt-0";
                document.getElementById('pno').value = "";
                
                setTimeout(verileriCek, 1000);
            } catch (error) {
                status.innerText = "Kayıt Hatası!";
                status.className = "text-sm font-medium px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 mt-2 md:mt-0";
            } finally {
                setTimeout(() => {
                    status.innerText = "Sistem Hazır";
                    status.className = "text-sm font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-300 mt-2 md:mt-0 border border
